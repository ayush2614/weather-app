<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Weather Map App</title>

  <link rel="stylesheet" href="style.css" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>
<body>

  <div class="container">
    <h1>मौसम Map </h1>
    <p class="subtitle">Search city, village, town or any location</p>

    <div class="search-box">
      <input
        type="text"
        id="locationInput"
        placeholder="Enter village / city / town..."
        autocomplete="off"
      />

      <button id="searchBtn" type="button">
        Search
      </button>
    </div>

    <div id="suggestions"></div>

    <button id="locationBtn" class="location-btn" type="button">
      📍 Use My Location
    </button>

    <p id="error"></p>

    <div class="content">
      <div class="weather-card hidden" id="weatherCard">
        <h2 id="placeName"></h2>
        <p id="placeDetails"></p>

        <div class="temp" id="temperature"></div>
        <p id="condition"></p>

        <div class="details">
          <p id="humidity"></p>
          <p id="wind"></p>
          <p id="rain"></p>
        </div>
      </div>

      <div id="map"></div>
    </div>

    <div class="forecast hidden" id="forecastBox">
      <h2>7 Days Forecast</h2>
      <div id="forecastList"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

</body>
</html>
