<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mausam Aaj Ka</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <main class="app">
    <section class="glass-card">
      <div class="header">
        <p class="tag">Live Weather</p>
        <h1>Mausam Aaj Ka</h1>
        <p class="lead">Search city, town or village weather instantly</p>
      </div>

      <div class="search-box">
        <input id="city" type="search" placeholder="Search your city or village..." autocomplete="off" />
        <button id="searchBtn">Search</button>
      </div>

      <p id="status" class="status">Enter a place and press Search.</p>

      <section id="result" class="weather-card hidden">
        <div class="main-weather">
          <div>
            <h2 id="cityName">—</h2>
            <p class="meta">
              <span id="desc">—</span> · <span id="localTime">—</span>
            </p>
          </div>

          <img id="icon" class="weather-icon" src="" alt="weather icon" />
        </div>

        <div class="temperature">
          <span id="temp">—</span><small>°C</small>
        </div>

        <div class="stats">
          <div class="stat">
            <span>Humidity</span>
            <strong><span id="humidity">—</span>%</strong>
          </div>

          <div class="stat">
            <span>Wind</span>
            <strong id="wind">—</strong>
          </div>

          <div class="stat">
            <span>Sunrise</span>
            <strong id="sunrise">—</strong>
          </div>

          <div class="stat">
            <span>Sunset</span>
            <strong id="sunset">—</strong>
          </div>
        </div>

        <div class="info-box">
          <h3>About Place</h3>
          <p id="placeInfo">Place information will appear here.</p>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
