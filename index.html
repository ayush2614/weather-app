<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mausam Aaj Ka</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <main class="card">
    <h1>आज का मौसम</h1>
    <p class="lead">जाने अपने शहर या गांव का मौसम</p>

    <div class="search">
      <input id="city" type="search" placeholder="Enter city / village / town" />
      <button id="searchBtn" class="btn">Search</button>
    </div>

    <section id="result" class="result hidden">
      <h2 id="cityName">—</h2>
      <div class="meta">
        <span id="desc">—</span> · <span id="localTime">—</span>
      </div>

      <div class="temp-row">
        <div class="temp">
          <span id="temp">—</span><small>°C</small>
        </div>
        <img id="icon" />
      </div>

      <div class="stats">
        <div>Humidity: <strong id="humidity">—</strong>%</div>
        <div>Wind: <strong id="wind">—</strong></div>
        <div>Sunrise: <strong id="sunrise">—</strong></div>
        <div>Sunset: <strong id="sunset">—</strong></div>
      </div>
    </section>

    <div id="status">Enter and hit search</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
